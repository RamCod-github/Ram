    <script>
        let popup = document.getElementById("popup");

        function openPopup() {
           // بنضيف الكلاس اللي بيخلي الـ top: 50%
           popup.classList.add("open-popup");
       }

       function closePopup() {
           // بنشيل الكلاس عشان يرجع يستخبي تاني فوق
           popup.classList.remove("open-popup");
       }
    </script>
